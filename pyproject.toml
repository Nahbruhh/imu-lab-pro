[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "imu-lab-pro"
version = "0.2.0.dev0"
description = "Measurement-driven structural dynamics and Digital Twin platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyserial>=3.5",
    "pyqtgraph>=0.13",
    "PySide6>=6.5",
]

[project.optional-dependencies]
3d = [
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "trimesh>=4.0",
]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
cache_dir = ".cache/pytest"
